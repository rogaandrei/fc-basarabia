name: Actualizează și publică site-ul

on:
  schedule:
    - cron: "20 */3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "data.json"
      - "data.js"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Citește datele de pe site-ul ligii
        id: update
        continue-on-error: true
        run: python scripts/update.py

      - name: Salvează datele noi (dacă s-au schimbat)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json data.js
          if git diff --cached --quiet; then
            echo "Nicio schimbare."
          else
            git commit -m "Actualizare date din liga"
            git push
          fi

      - name: Pregătește site-ul
        run: |
          mkdir _site
          cp -r index.html style.css script.js data.js data.json img _site/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4

      - name: Semnalează erorile de citire
        if: steps.update.outcome == 'failure'
        run: |
          echo "::error::Scriptul nu a putut citi o pagină a ligii."
          exit 1
